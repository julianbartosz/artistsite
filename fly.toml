app = "michalelena"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"
swap_size_mb = 512

[deploy]
  release_command = "sh scripts/release.sh"
  release_command_timeout = "5m"
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  # One always-on machine keeps the in-process automation scheduler running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
