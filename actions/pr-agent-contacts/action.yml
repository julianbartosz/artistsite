name: pr-agent-contacts
description: Annotate Qodo suggestion rows with prior git authors (blame).

inputs:
  command:
    description: annotate | self-test
    required: true
  script:
    description: Caller-owned override. Empty uses the bundled script.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        OVERRIDE: ${{ inputs.script }}
      run: |
        set -euo pipefail
        script="${{ github.action_path }}/../../scripts/pr-agent-contacts.sh"
        if [[ -n "${OVERRIDE//[[:space:]]/}" ]]; then
          if [[ -f "$OVERRIDE" ]]; then
            script="$OVERRIDE"
          else
            echo "::warning title=pr-agent-contacts::override missing at ${OVERRIDE}; using bundled script"
          fi
        fi
        [[ -f "$script" ]] || { echo "pr-agent-contacts: ${script} missing" >&2; exit 2; }
        case "$COMMAND" in
          self-test) bash "$script" --self-test ;;
          annotate) bash "$script" --annotate ;;
          *) echo "unknown command ${COMMAND}" >&2; exit 2 ;;
        esac
