name: Synthetic Monitoring

on:
  workflow_dispatch:
  push:
    branches: [main, feature/synthetic-monitoring-clean-v2]
    paths:
      - 'synthetics/**'
      - '.github/workflows/synthetics.yml'
  schedule:
    - cron: '0 */2 * * *'

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      SYNTHETIC_BASE_URL: 'https://michalelena.me'
      GRAFANA_SM_API_URL: ${{ secrets.GRAFANA_SM_API_URL }}
      GRAFANA_SM_API_TOKEN: ${{ secrets.GRAFANA_SM_API_TOKEN }}
      GRAFANA_CLOUD_STACK_ID: ${{ secrets.GRAFANA_CLOUD_STACK_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1

      - name: Smoke test (local)
        run: |
          k6 run synthetics/k6/uptime/homepage.k6.js
          k6 run synthetics/k6/api/health.k6.js

      - name: Validate all scripts
        run: |
          for script in synthetics/k6/**/*.k6.js; do
            echo "Validating $script"
            k6 inspect "$script"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight - SM API probes sanity
        run: |
          set -e
          echo "Base URL prefix: ${GRAFANA_SM_API_URL:0:40}..."
          echo "Stack ID: $GRAFANA_CLOUD_STACK_ID"
          echo "Token prefix: ${GRAFANA_SM_API_TOKEN:0:10}..."
          echo "Token length: ${#GRAFANA_SM_API_TOKEN}"
          echo "Full endpoint: $GRAFANA_SM_API_URL/api/v1/probes"
          echo ""
          code=$(curl -sS -o /tmp/probes.json -w "%{http_code}" \
            -H "Authorization: Bearer $GRAFANA_SM_API_TOKEN" \
            -H "X-Stack-Id: $GRAFANA_CLOUD_STACK_ID" \
            "$GRAFANA_SM_API_URL/api/v1/probes")
          echo "HTTP $code from /api/v1/probes"
          if [ "$code" != "200" ]; then
            echo "❌ Preflight failed. Dumping response:"
            cat /tmp/probes.json || true
            echo ""
            echo "💡 Common issues:"
            echo "  - GRAFANA_SM_API_URL should be: https://synthetic-monitoring-api-<region>.grafana.net"
            echo "  - NOT your Grafana Cloud URL (https://<stack>.grafana.net)"
            echo "  - Check: https://grafana.com/docs/grafana-cloud/testing/synthetic-monitoring/set-up/configure-api-access/"
            exit 1
          fi
          jq '.[0] // {}' /tmp/probes.json || cat /tmp/probes.json

      - name: Provision Synthetic Monitoring checks
        run: |
          echo "🚀 Provisioning Synthetic Monitoring checks..."
          node synthetics/grafana/create-checks.js --verbose
