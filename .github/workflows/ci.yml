name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  # Prisma generate requires a URL shape; CI does not connect to a live database.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/artistsite_ci?schema=public

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type checking
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-build-placeholder-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000

      - name: PR Agent script self-tests
        run: |
          set -euo pipefail
          bash actions/pr-agent-resolve/resolve.sh --self-test
          bash scripts/pr-agent-describe-track.sh --self-test
          bash scripts/pr-agent-contacts.sh --self-test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gates
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-build-placeholder-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.14.0

      - name: Run Lighthouse CI
        run: |
          set -euo pipefail
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 \
              || curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXTAUTH_SECRET: ci-build-placeholder-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000
