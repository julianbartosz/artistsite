name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  # Prisma generate requires a URL shape; jobs that need a live DB override with the service URL.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/artistsite_ci?schema=public
  NEXTAUTH_SECRET: ci-build-placeholder-not-for-production
  NEXTAUTH_URL: http://127.0.0.1:3000

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type checking
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: PR Agent script self-tests
        run: |
          set -euo pipefail
          bash actions/pr-agent-resolve/resolve.sh --self-test
          bash scripts/pr-agent-describe-track.sh --self-test
          bash scripts/pr-agent-contacts.sh --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.ts
            prisma
          retention-days: 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: artistsite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d artistsite_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build-${{ github.sha }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.14.0

      - name: Run Lighthouse CI
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Next.js server did not become ready for Lighthouse"
            exit 1
          fi
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NODE_ENV: production

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gates
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: artistsite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d artistsite_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build-${{ github.sha }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: |
          set -euo pipefail
          PLAYWRIGHT_E2E=true npm start -- --hostname 127.0.0.1 --port 3100 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Next.js server did not become ready for Playwright"
            exit 1
          fi
          PLAYWRIGHT_SKIP_WEBSERVER=true PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 \
            npx playwright test --project=chromium
        env:
          CI: true
          NODE_ENV: production
          PLAYWRIGHT_E2E: 'true'
          NEXTAUTH_URL: http://127.0.0.1:3100
          ADMIN_EMAILS: artist@artistsite.com
          LOCAL_ADMIN_PASSWORD: AdminPass123!
