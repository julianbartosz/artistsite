<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="midnightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="30%" r="30%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#midnightGradient)"/>
  <ellipse cx="200" cy="90" rx="80" ry="40" fill="url(#lightGlow)"/>
  <rect x="50" y="200" width="300" height="80" fill="#16213e" opacity="0.6"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Midnight Reflections</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Acrylic and Oil on Canvas, 2024</text>
</svg>