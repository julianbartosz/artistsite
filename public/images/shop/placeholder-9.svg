<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Second page of sketchbook with different studies -->
  <rect width="400" height="300" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1" />
  
  <!-- Spiral binding holes -->
  <circle cx="30" cy="40" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="80" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="120" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="160" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="200" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  
  <!-- Different urban sketches -->
  <g stroke="#424242" stroke-width="1.5" fill="none">
    <!-- Street scene -->
    <path d="M60 100 L120 80 L180 100 L240 90 L300 100" />
    <path d="M60 120 L300 110" />
    
    <!-- Trees and lamp posts -->
    <circle cx="100" cy="140" r="20" />
    <line x1="100" y1="160" x2="100" y2="180" />
    <circle cx="200" cy="130" r="15" />
    <line x1="200" y1="145" x2="200" y2="170" />
    
    <!-- Urban details -->
    <rect x="250" y="60" width="20" height="40" />
    <circle cx="260" cy="50" r="5" />
    
    <!-- Movement lines -->
    <path d="M80 200 Q150 180 220 200" stroke-dasharray="2,2" />
  </g>
  
  <!-- Notes -->
  <text x="60" y="250" font-size="8" fill="#666">shadow patterns</text>
  <text x="200" y="230" font-size="8" fill="#666">pedestrian flow</text>
  
  <!-- Page number -->
  <text x="370" y="280" font-size="8" fill="#999">02</text>
</svg>