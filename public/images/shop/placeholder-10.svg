<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="portraitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5" />
      <stop offset="100%" stop-color="#E1BEE7" />
    </linearGradient>
  </defs>
  
  <!-- Canvas background -->
  <rect width="400" height="300" fill="url(#portraitBg)" />
  
  <!-- Portrait frame -->
  <rect x="80" y="50" width="240" height="200" fill="#FFF" stroke="#E0E0E0" stroke-width="2" />
  
  <!-- Face outline -->
  <ellipse cx="200" cy="130" rx="50" ry="65" fill="#FFDBCB" stroke="#D7CCC8" stroke-width="1" />
  
  <!-- Eyes -->
  <ellipse cx="185" cy="115" rx="8" ry="5" fill="#5D4037" />
  <ellipse cx="215" cy="115" rx="8" ry="5" fill="#5D4037" />
  <circle cx="185" cy="115" r="2" fill="#FFF" />
  <circle cx="215" cy="115" r="2" fill="#FFF" />
  
  <!-- Nose -->
  <path d="M200 125 L195 135 L200 140 L205 135 Z" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="0.5" />
  
  <!-- Mouth -->
  <path d="M190 150 Q200 155 210 150" stroke="#8D6E63" stroke-width="2" fill="none" />
  
  <!-- Hair -->
  <path d="M150 100 Q200 80 250 100 Q240 120 200 110 Q160 120 150 100" fill="#6D4C41" />
  
  <!-- Shoulders -->
  <path d="M120 220 Q200 200 280 220 L280 250 L120 250 Z" fill="#424242" />
  
  <!-- Commission info overlay -->
  <rect x="20" y="20" width="120" height="40" fill="#FFF" stroke="#E0E0E0" stroke-width="1" rx="5" />
  <text x="30" y="35" font-size="10" fill="#424242" font-weight="bold">Custom Portrait</text>
  <text x="30" y="50" font-size="8" fill="#666">Your photo → Art</text>
  
  <!-- Style options -->
  <text x="340" y="280" font-size="8" fill="#666">Oil • Acrylic • Charcoal</text>
</svg>