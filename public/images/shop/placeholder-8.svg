<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sketchbook page background -->
  <rect width="400" height="300" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1" />
  
  <!-- Spiral binding holes -->
  <circle cx="30" cy="40" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="80" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="120" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="160" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  <circle cx="30" cy="200" r="3" fill="none" stroke="#BDBDBD" stroke-width="1" />
  
  <!-- Quick architectural sketches -->
  <g stroke="#424242" stroke-width="1.5" fill="none">
    <!-- Building 1 -->
    <rect x="60" y="60" width="40" height="60" />
    <line x1="65" y1="70" x2="75" y2="70" />
    <line x1="65" y1="80" x2="75" y2="80" />
    <line x1="85" y1="70" x2="95" y2="70" />
    <line x1="85" y1="80" x2="95" y2="80" />
    
    <!-- Building 2 -->
    <rect x="120" y="40" width="35" height="80" />
    <line x1="125" y1="50" x2="135" y2="50" />
    <line x1="125" y1="60" x2="135" y2="60" />
    <line x1="140" y1="50" x2="150" y2="50" />
    
    <!-- People sketches -->
    <circle cx="180" cy="90" r="8" />
    <line x1="180" y1="98" x2="180" y2="130" />
    <line x1="180" y1="110" x2="170" y2="120" />
    <line x1="180" y1="110" x2="190" y2="120" />
    <line x1="180" y1="130" x2="170" y2="150" />
    <line x1="180" y1="130" x2="190" y2="150" />
    
    <!-- Car sketch -->
    <ellipse cx="250" cy="110" rx="30" ry="12" />
    <circle cx="235" cy="120" r="6" />
    <circle cx="265" cy="120" r="6" />
  </g>
  
  <!-- Sketchy annotations -->
  <text x="60" y="140" font-size="8" fill="#666">morning light</text>
  <text x="180" y="170" font-size="8" fill="#666">rush hour</text>
  <text x="220" y="140" font-size="8" fill="#666">reflections</text>
  
  <!-- Artist signature -->
  <text x="320" y="280" font-size="10" fill="#424242" font-style="italic">J.B. '24</text>
</svg>